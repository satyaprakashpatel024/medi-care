# application name
spring.application.name=medi-care
# server port
server.port=8080
# Force Spring to register the H2 Console Servlet
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# Use this to ensure the path doesn't conflict with your API
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# H2 Database Settings
spring.datasource.url=jdbc:h2:file:./data/medicare;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Custom property for the secrets file location
#secrets.file.path=dbCredentials.txt
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Best Practice: Store in UTC, Display in IST
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# This handles N+1 globally by fetching collections in batches
spring.jpa.properties.hibernate.default_batch_fetch_size=5
spring.data.web.pageable.serialization-mode=via-dto
spring.mvc.favicon.enabled=false
# Focus on the Hikari level which actually controls the JDBC connection
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Jackson / JSON Fixes
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false
# validation
spring.validation.mode=strict
# Bootstrap Server
spring.kafka.bootstrap-servers=http://localhost:9092
# Security
spring.kafka.properties.security.protocol=SSL
# PEM Certificates
spring.kafka.properties.ssl.truststore.type=PEM
#spring.kafka.properties.ssl.truststore.location=classpath:certificates/ca.pem
spring.kafka.properties.ssl.keystore.type=PEM
#spring.kafka.properties.ssl.keystore.location=classpath:certificates/svc.pem
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Consumer
spring.kafka.consumer.group-id=email-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.care.medi.dtos
# Listener
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
# Actuator
management.endpoints.web.exposure.include=health,metrics
#management.endpoints.web.exposure.include=*
# security
#spring.security.user.name=admin
#spring.security.user.password=admin
# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
# The name and path of the log file
logging.level.org.springframework.web=DEBUG
logging.level.com.care.medi=DEBUG
logging.file.name=logs/medi-care.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# OpenAPI
# Change the Swagger UI path
springdoc.swagger-ui.enabled=true
# Define the JSON endpoint
springdoc.api-docs.path=/v3/api-docs
# Define the UI endpoint
springdoc.swagger-ui.path=/swagger-ui.html
# Ensure your package is scanned
springdoc.packages-to-scan=com.care.medi