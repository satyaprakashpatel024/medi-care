# Spring application configuration for unit and integration tests
spring.application.name=medi-care-test

# Active Profile
spring.profiles.active=test

# Database configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Kafka Configuration for Test Environment
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false

# Mail Service Settings for Test Environment
spring.mail.host=localhost
spring.mail.port=2525

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.care.medi=DEBUG
