<div class="flex h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-50 overflow-hidden relative">
  <!-- Ambient glowing blobs -->
  <div
    class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary-400/20 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 dark:bg-primary-900/30"></div>
  <div
    class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-secondary-400/20 rounded-full mix-blend-multiply filter blur-[100px] opacity-70 dark:bg-secondary-900/30"></div>

  <!-- Sidebar -->
  <aside
    class="relative z-10 w-64 m-4 flex flex-col bg-white/40 dark:bg-slate-900/40 backdrop-blur-2xl border border-white/40 dark:border-slate-800/60 rounded-3xl shadow-xl overflow-hidden">

    <div class="p-6 text-center border-b border-slate-200/50 dark:border-slate-800/50">
      <h2
        class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-primary-600 to-secondary-600 dark:from-primary-400 dark:to-secondary-400">
        Medicare</h2>
    </div>

    <nav class="flex-1 p-4 flex flex-col gap-2 overflow-y-auto">

      <!-- Common Links -->
      <a [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300"
         routerLink="/dashboard"
         routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
        <lucide-icon [img]="LayoutDashboard" size="20"></lucide-icon>
        Dashboard
      </a>

      <!-- Admin Links -->
      <ng-container
        *ngIf="authService.currentUserRole() === 'ROLE_SUPER_ADMIN' || authService.currentUserRole() === 'ROLE_HOSPITAL_ADMIN'">
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300"
           routerLink="/dashboard/hospitals"
           routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
          <lucide-icon [img]="Settings" size="20"></lucide-icon>
          Hospitals
        </a>
      </ng-container>

      <!-- Doctor Links -->
      <ng-container *ngIf="authService.currentUserRole() === 'ROLE_DOCTOR'">
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300" routerLink="/dashboard/schedule"
           routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
          <lucide-icon [img]="Calendar" size="20"></lucide-icon>
          My Schedule
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300" routerLink="/dashboard/patients"
           routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
          <lucide-icon [img]="Users" size="20"></lucide-icon>
          My Patients
        </a>
      </ng-container>

      <!-- Patient Links -->
      <ng-container *ngIf="authService.currentUserRole() === 'ROLE_PATIENT'">
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300"
           routerLink="/dashboard/appointments"
           routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
          <lucide-icon [img]="Calendar" size="20"></lucide-icon>
          Appointments
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all hover:bg-white/50 dark:hover:bg-slate-800/50 text-slate-700 dark:text-slate-300" routerLink="/dashboard/records"
           routerLinkActive="bg-primary-500 text-white shadow-md shadow-primary-500/20">
          <lucide-icon [img]="FileText" size="20"></lucide-icon>
          Medical Records
        </a>
      </ng-container>

    </nav>

    <div class="p-5 border-t border-slate-200/50 dark:border-slate-800/50 flex flex-col gap-4">

      <!-- Color Theme Swatches -->
      <div class="flex flex-col gap-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Accent Color</span>
        <div class="flex flex-wrap gap-2">
          <button (click)="onColorThemeChange(ct.id)"
                  *ngFor="let ct of themeService.colorThemes"
                  [class]="themeService.currentColorTheme() === ct.id ? 'border-slate-800 dark:border-white scale-110 ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-900' : 'border-transparent'"
                  [style.--tw-ring-color]="ct.swatch"
                  [style.background-color]="ct.swatch"
                  [title]="ct.label"
                  class="w-7 h-7 rounded-full border-2 transition-all hover:scale-110 shadow-sm">
          </button>
        </div>
      </div>

      <!-- Dark/Light Mode -->
      <div class="flex flex-col gap-2">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Mode</span>
        <select (change)="onThemeChange($event)" [value]="themeService.currentTheme()"
                class="bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm font-medium outline-none focus:ring-2 focus:ring-primary-500">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <button (click)="logout()"
              class="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 transition-colors">
        <lucide-icon [img]="LogOut" size="18"></lucide-icon>
        Log Out
      </button>
    </div>
  </aside>

  <main class="relative z-10 flex-1 flex flex-col p-4 pl-0 overflow-hidden">
    <!-- Top Header -->
    <header
      class="bg-white/40 dark:bg-slate-900/40 backdrop-blur-2xl border border-white/40 dark:border-slate-800/60 rounded-3xl p-4 md:px-8 mb-4 shadow-sm flex justify-between items-center">
      <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100">Welcome Back!</h3>
      <div class="flex items-center gap-4">
        <span
          class="bg-primary-100 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
          {{ authService.currentUserRole()?.replace('ROLE_', '') }}
        </span>
      </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto pr-2 rounded-3xl custom-scrollbar">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
